services:
  app:
    image: githubsearch-app:latest
    container_name: github-search-app
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/github_search
      DB_USERNAME: github_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: github-search-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: github_search
      POSTGRES_USER: github_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U github_user -d github_search" ]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:

