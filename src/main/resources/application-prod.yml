spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

github:
  api:
    base-url: https://api.github.com
    token: ${GITHUB_TOKEN:}      #github allows 10 req/ min without token

server:
  port: 8080
